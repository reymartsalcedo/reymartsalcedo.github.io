name: Update Last Updated

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        run: |
          echo "{\"lastUpdated\":\"$(TZ="Europe/Copenhagen" date +"%d %B %Y, %H:%M %Z")\"}" > last-updated.json

      - name: Commit file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last-updated.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update last updated timestamp"
            git push
          fi